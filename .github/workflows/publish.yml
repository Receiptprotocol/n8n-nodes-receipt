name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Use current provenance-capable npm
        run: npm install --global npm@12.0.1
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Validate release metadata
        run: |
          node -e 'const p = require("./package.json"); if (p.name !== "n8n-nodes-receipt") throw new Error("Unexpected package name"); if (process.env.GITHUB_REF_NAME !== `v${p.version}`) throw new Error("Release tag must match package version"); if (p.repository?.url !== "git+https://github.com/Receiptprotocol/n8n-nodes-receipt.git") throw new Error("Repository URL does not match provenance source")'
      - name: Typecheck
        run: bun run tsc --noEmit -p tsconfig.json
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build
      - name: Inspect package tarball
        run: npm pack --dry-run
      - name: Authenticate and release
        run: |
          test -n "${NPM_TOKEN:-}"
          [ -n "$NPM_TOKEN" ] &&
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm_identity="$(npm whoami --registry=https://registry.npmjs.org)"
          test "$npm_identity" = "jasonsmall"
          npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
